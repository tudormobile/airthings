  commentId: P:Tudormobile.Airthings.ApiResponse.IsSuccess
  id: IsSuccess
  parent: Tudormobile.Airthings.ApiResponse
  langs:
  - csharp
  - vb
  name: IsSuccess
  nameWithType: ApiResponse.IsSuccess
  fullName: Tudormobile.Airthings.ApiResponse.IsSuccess
  type: Property
  source:
    href: https://github.com/tudormobile/airthings/blob/2b351da493f2852dc47a21db691cad0c056efc51/src/Airthings/ApiResponse.cs
  assemblies:
  - Tudormobile.Airthings
  namespace: Tudormobile.Airthings
  summary: Gets a value indicating whether the request was successful.
  remarks: >-
    Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> when <xref href="Tudormobile.Airthings.ApiResponse.Message" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.

    None of the current Airthings API endpoints return a message on success, so this property

    is implemented to catch the error replies, which all return a simple message. Exceptions

    will aslo use the message property to return the error details, so this is a catch-all for any failed request. 


    <p>

    If the API adds successful messages in the future, this logic will need to be updated along with the 

    API response object builders to check for specific errors instead, and explicitly set the success status. 

    For now, this is sufficient to catch all errors, and the API does not return any messages on success.

    </p>
  example: []
  syntax:
    content: public bool IsSuccess { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsSuccess As Boolean
  overload: Tudormobile.Airthings.ApiResponse.IsSuccess*
